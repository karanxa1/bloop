name: deploy

# Builds and deploys the whole stack on every push to main:
#   sandbox worker (only when sandbox/ changed) → D1 schema → core worker (+ SPA assets) → smoke test.
# Required repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts/Containers/D1/R2/KV/Browser Rendering: Edit).
# Worker runtime secrets (AZURE_OPENAI_API_KEY, SANDBOX_TOKEN, …) already live in Cloudflare and are not touched.
# NEVER deploy from the repo root — its wrangler.jsonc is the old TS starter.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_sandbox:
        description: "deploy the sandbox worker even if sandbox/ is unchanged"
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  CLOUDFLARE_ACCOUNT_ID: 337c662fed500c2dff530141baaf75c9
  WRANGLER_VERSION: 4.129.0
  APP_URL: https://bloop.rough-cell-383c.workers.dev

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sandbox: ${{ steps.changes.outputs.sandbox }}
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # deploy only from main, and only once the token secret exists — otherwise
      # the checks still run and the deploy jobs skip instead of failing
      - id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          IS_MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$IS_MAIN" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            [ "$HAS_TOKEN" = "true" ] || echo "::notice::CLOUDFLARE_API_TOKEN secret not set — skipping deploy"
          fi

      - id: changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            sandbox:
              - 'sandbox/**'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            sandbox/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core

      - name: core — cargo check (wasm32)
        working-directory: core
        run: cargo check --target wasm32-unknown-unknown --locked

      - name: sandbox — typecheck
        working-directory: sandbox
        run: npm ci && npm run typecheck

      - name: web — build
        working-directory: web
        run: npm ci && npm run build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  deploy-sandbox:
    needs: check
    if: needs.check.outputs.deploy == 'true' && (needs.check.outputs.sandbox == 'true' || inputs.force_sandbox)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sandbox/package-lock.json
      - name: deploy bloop-sandbox (builds the container image with docker)
        working-directory: sandbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm ci && npx wrangler deploy --config wrangler.toml

  deploy-core:
    needs: [check, deploy-sandbox]
    # run even when deploy-sandbox was skipped, but never after a failure
    if: always() && needs.check.result == 'success' && needs.check.outputs.deploy == 'true' && needs.deploy-sandbox.result != 'failure' && needs.deploy-sandbox.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: web/dist

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: d1 schema (idempotent — CREATE … IF NOT EXISTS)
        working-directory: core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@${WRANGLER_VERSION} d1 execute bloop-db --remote --file schema.sql

      - name: deploy bloop core worker
        working-directory: core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@${WRANGLER_VERSION} deploy --config wrangler.toml

  smoke:
    needs: deploy-core
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: health + app shell respond
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsS "$APP_URL/api/health" | tee /tmp/health.json | grep -q '"ok":true'; then break; fi
            sleep 6
          done
          grep -q '"ok":true' /tmp/health.json
          curl -fsS -o /dev/null -w 'app %{http_code}\n' "$APP_URL/app"
          curl -fsS -o /dev/null -w 'landing %{http_code}\n' "$APP_URL/"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/api/files/context")
          test "$code" = "401" # auth guard intact
