name = "bloop"
main = "build/worker/shim.mjs"
compatibility_date = "2026-05-01"

build.command = "cargo install -q worker-build --version 0.8.5 --locked && worker-build --release"

[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = ["/", "/app", "/app/*"]

[[d1_databases]]
binding = "DB"
database_name = "bloop-db"
database_id = "4553b829-7a3d-436d-be23-c71bcf0d32ae"

[[kv_namespaces]]
binding = "SESSIONS"
id = "2b0ca58636b24505ba5d678e512a801b"

[[r2_buckets]]
binding = "FILES"
bucket_name = "bloop-files"

# worker→worker: run_code tool (avoids the workers.dev subrequest ban)
[[services]]
binding = "SANDBOX"
service = "bloop-sandbox"

# drop the TS starter's ChatAgent class (rust backend uses D1, not DOs)
[[migrations]]
tag = "v2"
deleted_classes = ["ChatAgent"]

[vars]
AZURE_OPENAI_ENDPOINT = "https://callmissed-resource.cognitiveservices.azure.com"
AZURE_OPENAI_API_VERSION = "2025-04-01-preview"
AGENT_MODEL = "gpt-5.6-terra"
AGENT_MODEL_FALLBACK = "gpt-5.6-sol"
# Operator-credentialed MCP servers (GITHUB_TOKEN, COMPOSIO_*, ZAPIER_*, EXTRA_MCP_*) are attached only for these accounts.
ADMIN_EMAILS = "karan@bloop.dev"
# Prod reaches the sandbox only via the SANDBOX service binding. For local dev
# without the binding, set SANDBOX_URL (and DEV_ORIGINS for the Vite origins) in .dev.vars.
